<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.5" stop-color="#0f1a35"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#7c4dff;#ff4081;#00e5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7c4dff">
        <animate attributeName="stop-color" values="#7c4dff;#ff4081;#00e5ff;#7c4dff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4081" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="320" rx="24"/></clipPath>
    <clipPath id="typeclip">
      <rect x="80" y="205" height="44">
        <animate attributeName="width" values="0;800;800;0" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle cx="170" cy="90" r="110" fill="#00e5ff" opacity="0.35" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;120,40;40,-20;0,0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="240" r="130" fill="#7c4dff" opacity="0.40" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-140,-50;-40,30;0,0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="40" r="90" fill="#ff4081" opacity="0.25" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-90,60;60,80;0,0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- particles -->
    <g fill="#ffffff">
      <circle cx="120" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="270" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="40" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="120" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="280" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="250" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- tag -->
    <text x="80" y="82" font-family="'Courier New', monospace" font-size="16" fill="#00e5ff" letter-spacing="4" opacity="0">
      &lt;/&gt; HELLO, WORLD — I AM
      <animate attributeName="opacity" from="0" to="0.9" dur="1s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="76" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="url(#txt)" filter="url(#glow)" opacity="0">
      BLAŽ
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" dur="1.2s" begin="0.4s" fill="freeze"/>
    </text>

    <!-- typed subtitle -->
    <g clip-path="url(#typeclip)">
      <text x="80" y="234" font-family="'Courier New', Consolas, monospace" font-size="24" fill="#cfd8dc">Software Engineering Student · Backend · Microservices</text>
    </g>
    <rect y="210" width="3" height="30" fill="#00e5ff">
      <animate attributeName="x" values="80;880;880;80" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- decorative line -->
    <rect x="80" y="272" width="840" height="2" fill="url(#line)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="298" font-family="'Courier New', monospace" font-size="14" fill="#78909c" letter-spacing="2">JAVA · SPRING BOOT · POSTGRESQL · DOCKER · CROATIA</text>
  </g>

  <rect x="1" y="1" width="998" height="318" rx="24" fill="none" stroke="#7c4dff" stroke-opacity="0.35"/>
</svg>
